<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSTOCKS TERMINAL // Funding Arbitrage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
            --deep-purple: #1a0033;
            --dark-bg: #0a0014;
            --panel-bg: rgba(26, 0, 51, 0.6);
            --grid-color: rgba(0, 240, 255, 0.1);
            --positive: #00ff88;
            --negative: #ff0066;
            --warning: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--dark-bg);
            color: var(--neon-cyan);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(135deg, var(--deep-purple) 0%, var(--dark-bg) 50%, #000033 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: -1;
            opacity: 0.3;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Scanline effect */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            margin-bottom: 3rem;
            position: relative;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
            position: relative;
            animation: textGlow 3s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from {
                filter: drop-shadow(0 0 10px var(--neon-cyan));
            }
            to {
                filter: drop-shadow(0 0 30px var(--neon-magenta));
            }
        }

        .status-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.5rem 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-cyan);
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .status-badge.live {
            border-color: var(--positive);
            color: var(--positive);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .subtitle {
            font-size: 0.9rem;
            color: rgba(0, 240, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 300;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, transparent 50%, var(--neon-cyan) 50%);
            opacity: 0.5;
        }

        .stat-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            transform: translateY(-5px);
        }

        .stat-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(0, 240, 255, 0.7);
            margin-bottom: 1rem;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            letter-spacing: 0.05em;
        }

        .stat-value.positive {
            color: var(--positive);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }

        .stat-value.neutral {
            color: rgba(255, 255, 255, 0.5);
            text-shadow: none;
        }

        /* Panel Section */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .panel-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--neon-cyan);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .panel-header::before {
            content: '//';
            color: var(--neon-magenta);
            font-size: 1.8rem;
        }

        /* Opportunity Cards */
        .opportunity-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)) 1;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out both;
        }

        .opportunity-card:nth-child(1) { animation-delay: 0.1s; }
        .opportunity-card:nth-child(2) { animation-delay: 0.2s; }
        .opportunity-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .opportunity-card:hover {
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
            transform: scale(1.02);
        }

        .opportunity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .opportunity-symbol {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.6);
        }

        .opportunity-spread {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--negative);
            background: rgba(255, 0, 102, 0.1);
            padding: 0.5rem 1.5rem;
            border: 2px solid var(--negative);
            text-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .opportunity-strategy {
            display: flex;
            align-items: center;
            gap: 2rem;
            font-size: 0.95rem;
        }

        .exchange-badge {
            padding: 1rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .exchange-badge.long {
            border-color: var(--positive);
            background: rgba(0, 255, 136, 0.1);
            color: var(--positive);
        }

        .exchange-badge.long:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
            transform: translateY(-3px);
        }

        .exchange-badge.short {
            border-color: var(--negative);
            background: rgba(255, 0, 102, 0.1);
            color: var(--negative);
        }

        .exchange-badge.short:hover {
            background: rgba(255, 0, 102, 0.2);
            box-shadow: 0 0 25px rgba(255, 0, 102, 0.5);
            transform: translateY(-3px);
        }

        .arrow {
            font-size: 2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            animation: arrowPulse 2s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .no-opportunities {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(0, 240, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Chart Container */
        .chart-container {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 2.5rem;
            margin-bottom: 2rem;
            min-height: 400px;
            animation: fadeIn 1s ease-out 0.9s both;
        }

        /* Table */
        .table-container {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            overflow-x: auto;
            animation: fadeIn 1s ease-out 1.2s both;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead {
            background: rgba(0, 0, 0, 0.5);
        }

        th {
            padding: 1.2rem 1rem;
            text-align: left;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
        }

        tbody tr {
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(0, 240, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1);
        }

        td {
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
        }

        .symbol {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--neon-yellow);
            font-size: 1rem;
            letter-spacing: 0.1em;
        }

        .symbol-link {
            color: var(--neon-cyan);
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .symbol-link:hover {
            color: var(--neon-magenta);
            text-shadow: 0 0 10px var(--neon-magenta);
        }

        .rate {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .rate.positive {
            color: var(--negative);
            text-shadow: 0 0 5px rgba(255, 0, 102, 0.5);
        }

        .rate.negative {
            color: var(--positive);
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        .rate.neutral {
            color: rgba(255, 255, 255, 0.4);
        }

        .spread {
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .spread.high {
            background: rgba(255, 0, 102, 0.1);
            border-color: var(--negative);
            color: var(--negative);
        }

        .no-data {
            color: rgba(255, 255, 255, 0.2);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(0, 240, 255, 0.7);
        }

        select, input {
            background: rgba(0, 0, 0, 0.5);
            color: var(--neon-cyan);
            border: 2px solid rgba(0, 240, 255, 0.3);
            padding: 0.8rem 1.2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s ease;
        }

        select:hover, input:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        select:focus, input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        button {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--neon-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        button:hover::before {
            width: 300%;
            height: 300%;
        }

        button:hover {
            color: var(--dark-bg);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        button span {
            position: relative;
            z-index: 1;
        }

        .last-update {
            margin-top: 2rem;
            text-align: right;
            color: rgba(0, 240, 255, 0.5);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% {
                opacity: 0.4;
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(0, 240, 255, 1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .opportunity-strategy {
                flex-direction: column;
                gap: 1rem;
            }

            .panel {
                padding: 1.5rem;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
            border: 1px solid rgba(0, 240, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            border-radius: 0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <div class="container">
        <header>
            <div class="title-container">
                <h1>XSTOCKS TERMINAL</h1>
                <span class="status-badge" id="status">CONNECTING</span>
            </div>
            <p class="subtitle">FUNDING RATE ARBITRAGE MONITOR // REAL-TIME</p>
        </header>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">OPPORTUNITIES</div>
                <div class="stat-value" id="totalOpportunities">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">MAX SPREAD</div>
                <div class="stat-value positive" id="maxSpread">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">AVG SPREAD</div>
                <div class="stat-value neutral" id="avgSpread">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TOKENS TRACKED</div>
                <div class="stat-value neutral" id="tokenCount">--</div>
            </div>
        </div>

        <!-- Arbitrage Opportunities -->
        <div class="panel">
            <div class="panel-header">ARBITRAGE OPPORTUNITIES</div>
            <div id="opportunities">
                <div class="loading">INITIALIZING</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label class="filter-label">Exchange</label>
                <select id="exchangeFilter">
                    <option value="all">ALL</option>
                    <option value="gateio">GATE.IO</option>
                    <option value="bitget">BITGET</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Search Token</label>
                <input type="text" id="symbolSearch" placeholder="AAPL, TSLA...">
            </div>
        </div>

        <!-- Funding Rates Table -->
        <div class="panel">
            <div class="panel-header">FUNDING RATES MATRIX</div>
            <div class="table-container">
                <div id="content">
                    <div class="loading">LOADING DATA</div>
                </div>
            </div>
        </div>

        <div class="last-update" id="lastUpdate"></div>

        <!-- Data Verification Section -->
        <div class="panel">
            <div class="panel-header">DATA VERIFICATION</div>
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Exchange</label>
                    <select id="verifyExchange">
                        <option value="">SELECT</option>
                        <option value="gateio">GATE.IO</option>
                        <option value="bitget">BITGET</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Token</label>
                    <select id="verifySymbol">
                        <option value="">SELECT</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Period</label>
                    <select id="verifyPeriod">
                        <option value="7">7 DAYS</option>
                        <option value="30">30 DAYS</option>
                    </select>
                </div>
                <button id="verifyButton"><span>VERIFY</span></button>
            </div>

            <div class="table-container" id="verificationTable" style="margin-top: 2rem; display: none;">
                <div id="verificationContent"></div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let reconnectInterval = 3000;
        let currentData = null;

        // Get exchange URL for a symbol
        function getExchangeURL(exchange, symbol) {
            const upperSymbol = symbol.toUpperCase();

            if (exchange === 'gateio') {
                return `https://www.gate.io/futures/USDT/${upperSymbol}X_USDT`;
            } else if (exchange === 'bitget') {
                return `https://www.bitget.com/futures/usdt/${upperSymbol}USDT`;
            }
            return '#';
        }

        function connect() {
            ws = new WebSocket('ws://localhost:3001');

            ws.onopen = () => {
                console.log('Connected to server');
                document.getElementById('status').textContent = 'LIVE';
                document.getElementById('status').classList.add('live');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                currentData = data;
                updateDashboard(data);
            };

            ws.onclose = () => {
                console.log('Disconnected from server');
                document.getElementById('status').textContent = 'DISCONNECTED';
                document.getElementById('status').classList.remove('live');
                setTimeout(connect, reconnectInterval);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function updateStats(opportunities, fundingRates) {
            document.getElementById('totalOpportunities').textContent = opportunities.length;

            if (opportunities.length > 0) {
                const maxSpread = Math.max(...opportunities.map(o => Math.abs(o.spreadPercentage)));
                document.getElementById('maxSpread').textContent = maxSpread.toFixed(4) + '%';

                const avgSpread = opportunities.reduce((sum, o) => sum + Math.abs(o.spreadPercentage), 0) / opportunities.length;
                document.getElementById('avgSpread').textContent = avgSpread.toFixed(4) + '%';
            } else {
                document.getElementById('maxSpread').textContent = '0.0000%';
                document.getElementById('avgSpread').textContent = '0.0000%';
            }

            const uniqueSymbols = new Set(fundingRates.map(r => r.symbol));
            document.getElementById('tokenCount').textContent = uniqueSymbols.size;
        }

        function updateOpportunities(opportunities) {
            const container = document.getElementById('opportunities');

            if (opportunities.length === 0) {
                container.innerHTML = '<div class="no-opportunities">NO OPPORTUNITIES DETECTED</div>';
                return;
            }

            let html = '';
            opportunities.slice(0, 10).forEach(opp => {
                const longURL = getExchangeURL(opp.longExchange, opp.symbol);
                const shortURL = getExchangeURL(opp.shortExchange, opp.symbol);

                html += `
                    <div class="opportunity-card">
                        <div class="opportunity-header">
                            <div class="opportunity-symbol">${opp.symbol.toUpperCase()}</div>
                            <div class="opportunity-spread">${opp.spreadPercentage.toFixed(4)}%</div>
                        </div>
                        <div class="opportunity-strategy">
                            <a href="${longURL}" target="_blank" style="text-decoration: none;">
                                <div class="exchange-badge long">
                                    LONG ${opp.longExchange.toUpperCase()}<br>
                                    ${(opp.longRate * 100).toFixed(4)}%
                                </div>
                            </a>
                            <div class="arrow">→</div>
                            <a href="${shortURL}" target="_blank" style="text-decoration: none;">
                                <div class="exchange-badge short">
                                    SHORT ${opp.shortExchange.toUpperCase()}<br>
                                    ${(opp.shortRate * 100).toFixed(4)}%
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateDashboard(data) {
            const { fundingRates, opportunities, timestamp } = data;

            // Update stats
            updateStats(opportunities, fundingRates);

            // Update opportunities
            updateOpportunities(opportunities);

            // Update verification symbols
            updateVerificationSymbols();

            // Group rates by symbol with full rate objects
            const ratesBySymbol = {};
            fundingRates.forEach(rate => {
                if (!ratesBySymbol[rate.symbol]) {
                    ratesBySymbol[rate.symbol] = {};
                }
                ratesBySymbol[rate.symbol][rate.exchange] = rate;
            });

            // Get all exchanges
            const exchanges = [...new Set(fundingRates.map(r => r.exchange))];

            // Apply filters
            const exchangeFilter = document.getElementById('exchangeFilter').value;
            const symbolSearch = document.getElementById('symbolSearch').value.toLowerCase();

            // Build table
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2">TOKEN</th>
                            ${exchanges.map(ex => `<th colspan="3">${ex.toUpperCase()}</th>`).join('')}
                            <th rowspan="2">SPREAD</th>
                        </tr>
                        <tr>
                            ${exchanges.map(() => `<th style="font-size: 0.65rem;">CURRENT</th><th style="font-size: 0.65rem;">7D</th><th style="font-size: 0.65rem;">30D</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            Object.keys(ratesBySymbol).sort().forEach(symbol => {
                // Apply symbol filter
                if (symbolSearch && !symbol.toLowerCase().includes(symbolSearch)) {
                    return;
                }

                const rates = ratesBySymbol[symbol];

                // Apply exchange filter
                if (exchangeFilter !== 'all' && !rates[exchangeFilter]) {
                    return;
                }

                const rateObjects = Object.values(rates).filter(v => v !== undefined);
                const rateValues = rateObjects.map(r => r.fundingRate);
                const maxRate = Math.max(...rateValues);
                const minRate = Math.min(...rateValues);
                const spread = maxRate - minRate;

                html += `<tr>`;
                html += `<td class="symbol">${symbol.toUpperCase()}</td>`;

                exchanges.forEach(exchange => {
                    const rateObj = rates[exchange];
                    if (rateObj !== undefined) {
                        const ratePercent = (rateObj.fundingRate * 100).toFixed(4);
                        const rateClass = rateObj.fundingRate > 0 ? 'positive' : rateObj.fundingRate < 0 ? 'negative' : 'neutral';
                        const exchangeURL = getExchangeURL(exchange, symbol);

                        // Current rate
                        html += `<td><a href="${exchangeURL}" target="_blank" class="symbol-link"><span class="rate ${rateClass}">${ratePercent}%</span></a></td>`;

                        // 7-day cumulative
                        if (rateObj.cumulativeFunding7d !== undefined) {
                            const cum7d = (rateObj.cumulativeFunding7d * 100).toFixed(3);
                            const cum7dClass = rateObj.cumulativeFunding7d > 0 ? 'positive' : rateObj.cumulativeFunding7d < 0 ? 'negative' : 'neutral';
                            html += `<td><span class="rate ${cum7dClass}" style="font-size: 0.75rem;">${cum7d}%</span></td>`;
                        } else {
                            html += `<td class="no-data">--</td>`;
                        }

                        // 30-day cumulative
                        if (rateObj.cumulativeFunding30d !== undefined) {
                            const cum30d = (rateObj.cumulativeFunding30d * 100).toFixed(3);
                            const cum30dClass = rateObj.cumulativeFunding30d > 0 ? 'positive' : rateObj.cumulativeFunding30d < 0 ? 'negative' : 'neutral';
                            html += `<td><span class="rate ${cum30dClass}" style="font-size: 0.75rem;">${cum30d}%</span></td>`;
                        } else {
                            html += `<td class="no-data">--</td>`;
                        }
                    } else {
                        html += `<td class="no-data" colspan="3">--</td>`;
                    }
                });

                const spreadPercent = (spread * 100).toFixed(4);
                const spreadClass = spread > 0.0001 ? 'high' : '';
                html += `<td><span class="spread ${spreadClass}">${spreadPercent}%</span></td>`;
                html += `</tr>`;
            });

            html += `</tbody></table>`;

            document.getElementById('content').innerHTML = html;

            // Update timestamp
            const date = new Date(timestamp);
            document.getElementById('lastUpdate').textContent =
                `LAST UPDATE: ${date.toLocaleString('ko-KR')}`;
        }

        // Populate verification symbol dropdown
        function updateVerificationSymbols() {
            if (!currentData) return;

            const symbolSet = new Set();
            currentData.fundingRates.forEach(rate => {
                symbolSet.add(rate.symbol);
            });

            const select = document.getElementById('verifySymbol');
            const currentValue = select.value;
            select.innerHTML = '<option value="">SELECT</option>';

            Array.from(symbolSet).sort().forEach(symbol => {
                const option = document.createElement('option');
                option.value = symbol;
                option.textContent = symbol.toUpperCase();
                select.appendChild(option);
            });

            if (currentValue && symbolSet.has(currentValue)) {
                select.value = currentValue;
            }
        }

        // Show verification data
        function showVerificationData() {
            const exchange = document.getElementById('verifyExchange').value;
            const symbol = document.getElementById('verifySymbol').value;
            const period = document.getElementById('verifyPeriod').value;

            if (!exchange || !symbol || !currentData) {
                alert('Please select exchange and token');
                return;
            }

            // Find the rate object
            const rateObj = currentData.fundingRates.find(r =>
                r.exchange === exchange && r.symbol === symbol
            );

            if (!rateObj) {
                alert('Data not found for selected exchange/token');
                return;
            }

            const history = period === '7' ? rateObj.history7d : rateObj.history30d;

            if (!history || history.length === 0) {
                alert(`No ${period}-day history data available`);
                return;
            }

            // Build verification table
            let html = `
                <div class="panel-header">
                    ${exchange.toUpperCase()} - ${symbol.toUpperCase()} (${period} DAYS)
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>TIMESTAMP</th>
                            <th>FUNDING RATE</th>
                            <th>CUMULATIVE</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let cumulative = 0;
            history.forEach((entry, index) => {
                cumulative += entry.fundingRate;
                const date = new Date(entry.timestamp);
                const ratePercent = (entry.fundingRate * 100).toFixed(4);
                const cumulativePercent = (cumulative * 100).toFixed(4);
                const rateClass = entry.fundingRate > 0 ? 'positive' : entry.fundingRate < 0 ? 'negative' : 'neutral';
                const cumulativeClass = cumulative > 0 ? 'positive' : cumulative < 0 ? 'negative' : 'neutral';

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="font-size: 0.75rem;">${date.toLocaleString('ko-KR')}</td>
                        <td><span class="rate ${rateClass}">${ratePercent}%</span></td>
                        <td><span class="rate ${cumulativeClass}" style="font-weight: 700;">${cumulativePercent}%</span></td>
                    </tr>
                `;
            });

            const finalCumulative = period === '7' ? rateObj.cumulativeFunding7d : rateObj.cumulativeFunding30d;
            const finalPercent = finalCumulative !== undefined ? (finalCumulative * 100).toFixed(4) : 'N/A';

            html += `
                    </tbody>
                    <tfoot style="background: rgba(0, 0, 0, 0.5); font-weight: 700;">
                        <tr>
                            <td colspan="2">TOTAL (${history.length} entries)</td>
                            <td>--</td>
                            <td><span style="color: var(--neon-cyan); font-size: 1.1rem;">${finalPercent}%</span></td>
                        </tr>
                    </tfoot>
                </table>
            `;

            document.getElementById('verificationContent').innerHTML = html;
            document.getElementById('verificationTable').style.display = 'block';
        }

        // Setup filters
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('exchangeFilter').addEventListener('change', () => {
                if (currentData) updateDashboard(currentData);
            });

            document.getElementById('symbolSearch').addEventListener('input', () => {
                if (currentData) updateDashboard(currentData);
            });

            document.getElementById('verifyButton').addEventListener('click', showVerificationData);
        });

        // Connect on load
        connect();
    </script>
</body>
</html>

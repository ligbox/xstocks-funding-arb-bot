<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XStocks Funding Rate Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #1e2a47;
            padding-bottom: 20px;
        }

        h1 {
            color: #00d4aa;
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            color: #00d4aa;
            font-size: 20px;
            margin-bottom: 15px;
            margin-top: 30px;
        }

        .subtitle {
            color: #8b92a7;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 6px 14px;
            background: #1e2a47;
            border-radius: 12px;
            font-size: 13px;
            margin-left: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        .status.live {
            background: #00d4aa;
            color: #0a0e27;
            font-weight: 600;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #131729;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1e2a47;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: #8b92a7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #00d4aa;
        }

        .stat-value.neutral {
            color: #8b92a7;
        }

        /* Opportunities Section */
        .opportunities-container {
            background: #131729;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid #1e2a47;
        }

        .opportunity-card {
            background: linear-gradient(135deg, #1e2a47 0%, #131729 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #00d4aa;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .opportunity-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 212, 170, 0.2);
        }

        .opportunity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .opportunity-symbol {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .opportunity-spread {
            font-size: 24px;
            font-weight: 700;
            color: #ff4d6d;
            padding: 8px 16px;
            background: rgba(255, 77, 109, 0.15);
            border-radius: 8px;
        }

        .opportunity-strategy {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 15px;
            margin-top: 10px;
        }

        .exchange-badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
        }

        .exchange-badge.long {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }

        .exchange-badge.short {
            background: rgba(255, 77, 109, 0.2);
            color: #ff4d6d;
        }

        .arrow {
            font-size: 24px;
            color: #8b92a7;
        }

        .no-opportunities {
            text-align: center;
            padding: 40px;
            color: #8b92a7;
            font-size: 16px;
        }

        /* Table Styles */
        .table-container {
            background: #131729;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e2a47;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead {
            background: #1e2a47;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b92a7;
            border-bottom: 2px solid #0a0e27;
        }

        tbody tr {
            border-bottom: 1px solid #1e2a47;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #1a1f38;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 16px;
            font-size: 14px;
        }

        .symbol {
            font-weight: 600;
            color: #ffffff;
            font-size: 15px;
        }

        .symbol-link {
            color: #00d4aa;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }

        .symbol-link:hover {
            color: #00ffcc;
            text-decoration: underline;
        }

        .rate {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 13px;
        }

        .rate.positive {
            color: #ff4d6d;
        }

        .rate.negative {
            color: #00d4aa;
        }

        .rate.neutral {
            color: #8b92a7;
        }

        .spread {
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(0, 212, 170, 0.1);
            color: #00d4aa;
        }

        .spread.high {
            background: rgba(255, 77, 109, 0.1);
            color: #ff4d6d;
        }

        .no-data {
            color: #4a5568;
            font-style: italic;
        }

        /* Chart Container */
        .chart-container {
            background: #131729;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #1e2a47;
            height: 350px;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-label {
            font-size: 12px;
            color: #8b92a7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            background: #1e2a47;
            color: #e0e0e0;
            border: 1px solid #2a3654;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, input:hover {
            border-color: #00d4aa;
        }

        select:focus, input:focus {
            border-color: #00d4aa;
        }

        .last-update {
            margin-top: 20px;
            text-align: right;
            color: #8b92a7;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #8b92a7;
            font-size: 16px;
        }

        .loading::after {
            content: '...';
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                📊 XStocks Funding Rate Dashboard
                <span class="status" id="status">연결 중</span>
            </h1>
            <p class="subtitle">실시간 펀딩 수수료 및 차익거래 기회 모니터링</p>
        </header>

        <!-- Statistics -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">총 차익거래 기회</div>
                <div class="stat-value" id="totalOpportunities">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최대 스프레드</div>
                <div class="stat-value" id="maxSpread">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">평균 스프레드</div>
                <div class="stat-value neutral" id="avgSpread">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">모니터링 토큰</div>
                <div class="stat-value neutral" id="tokenCount">-</div>
            </div>
        </div>

        <!-- Arbitrage Opportunities -->
        <div class="opportunities-container">
            <h2>🎯 차익거래 기회</h2>
            <div id="opportunities">
                <div class="loading">데이터 로딩 중</div>
            </div>
        </div>

        <!-- Funding Rate Chart -->
        <div class="chart-container">
            <h2>📈 펀딩 수수료 추이</h2>
            <canvas id="fundingChart"></canvas>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label class="filter-label">거래소 필터</label>
                <select id="exchangeFilter">
                    <option value="all">전체</option>
                    <option value="gateio">GateIO</option>
                    <option value="bitget">Bitget</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">토큰 검색</label>
                <input type="text" id="symbolSearch" placeholder="예: AAPL, TSLA">
            </div>
        </div>

        <!-- Funding Rates Table -->
        <h2>💰 실시간 펀딩 수수료</h2>
        <div class="table-container">
            <div id="content">
                <div class="loading">서버 연결 중</div>
            </div>
        </div>

        <div class="last-update" id="lastUpdate"></div>

        <!-- Data Verification Section -->
        <h2>🔍 데이터 검증</h2>
        <div class="filters">
            <div class="filter-group">
                <label class="filter-label">거래소</label>
                <select id="verifyExchange">
                    <option value="">선택</option>
                    <option value="gateio">Gate.io</option>
                    <option value="bitget">Bitget</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">토큰</label>
                <select id="verifySymbol">
                    <option value="">선택</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">기간</label>
                <select id="verifyPeriod">
                    <option value="7">7일</option>
                    <option value="30">30일</option>
                </select>
            </div>
            <button id="verifyButton" style="padding: 10px 20px; background: #00d4aa; color: #0a0e27; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 20px;">조회</button>
        </div>

        <div class="table-container" id="verificationTable" style="margin-top: 20px; display: none;">
            <div id="verificationContent"></div>
        </div>
    </div>

    <script>
        let ws;
        let reconnectInterval = 3000;
        let currentData = null;
        let chartInstance = null;
        let historyData = [];
        const MAX_HISTORY = 50;

        // Initialize Chart
        function initChart() {
            const ctx = document.getElementById('fundingChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: []
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#8b92a7'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#8b92a7' },
                            grid: { color: '#1e2a47' }
                        },
                        y: {
                            ticks: {
                                color: '#8b92a7',
                                callback: function(value) {
                                    return (value * 100).toFixed(3) + '%';
                                }
                            },
                            grid: { color: '#1e2a47' }
                        }
                    }
                }
            });
        }

        // Get exchange URL for a symbol
        function getExchangeURL(exchange, symbol) {
            const upperSymbol = symbol.toUpperCase();

            if (exchange === 'gateio') {
                // GateIO Perpetual Futures format
                return `https://www.gate.io/futures/USDT/${upperSymbol}X_USDT`;
            } else if (exchange === 'bitget') {
                // Bitget format
                return `https://www.bitget.com/futures/usdt/${upperSymbol}USDT`;
            }
            return '#';
        }

        function connect() {
            ws = new WebSocket('ws://localhost:3001');

            ws.onopen = () => {
                console.log('Connected to server');
                document.getElementById('status').textContent = '실시간';
                document.getElementById('status').classList.add('live');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                currentData = data;
                updateDashboard(data);
                updateHistory(data);
            };

            ws.onclose = () => {
                console.log('Disconnected from server');
                document.getElementById('status').textContent = '연결 끊김';
                document.getElementById('status').classList.remove('live');
                setTimeout(connect, reconnectInterval);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function updateHistory(data) {
            historyData.push({
                timestamp: data.timestamp,
                rates: data.fundingRates
            });

            if (historyData.length > MAX_HISTORY) {
                historyData.shift();
            }

            updateChart();
        }

        function updateChart() {
            if (!chartInstance || historyData.length === 0) return;

            const labels = historyData.map(d =>
                new Date(d.timestamp).toLocaleTimeString('ko-KR', {
                    hour: '2-digit',
                    minute: '2-digit'
                })
            );

            // Get top symbols by absolute funding rate
            const symbolsSet = new Set();
            historyData.forEach(d => {
                d.rates.forEach(r => symbolsSet.add(r.symbol));
            });
            const symbols = Array.from(symbolsSet).slice(0, 6);

            const colors = [
                '#00d4aa', '#ff4d6d', '#4d9fff', '#ffa64d', '#9d4dff', '#ff4dbb'
            ];

            const datasets = symbols.map((symbol, idx) => {
                const data = historyData.map(d => {
                    const rates = d.rates.filter(r => r.symbol === symbol);
                    if (rates.length === 0) return null;
                    const avg = rates.reduce((sum, r) => sum + r.fundingRate, 0) / rates.length;
                    return avg;
                });

                return {
                    label: symbol.toUpperCase(),
                    data: data,
                    borderColor: colors[idx % colors.length],
                    backgroundColor: 'transparent',
                    tension: 0.3
                };
            });

            chartInstance.data.labels = labels;
            chartInstance.data.datasets = datasets;
            chartInstance.update();
        }

        function updateStats(opportunities, fundingRates) {
            document.getElementById('totalOpportunities').textContent = opportunities.length;

            if (opportunities.length > 0) {
                const maxSpread = Math.max(...opportunities.map(o => Math.abs(o.spreadPercentage)));
                document.getElementById('maxSpread').textContent = maxSpread.toFixed(4) + '%';

                const avgSpread = opportunities.reduce((sum, o) => sum + Math.abs(o.spreadPercentage), 0) / opportunities.length;
                document.getElementById('avgSpread').textContent = avgSpread.toFixed(4) + '%';
            } else {
                document.getElementById('maxSpread').textContent = '0.0000%';
                document.getElementById('avgSpread').textContent = '0.0000%';
            }

            const uniqueSymbols = new Set(fundingRates.map(r => r.symbol));
            document.getElementById('tokenCount').textContent = uniqueSymbols.size;
        }

        function updateOpportunities(opportunities) {
            const container = document.getElementById('opportunities');

            if (opportunities.length === 0) {
                container.innerHTML = '<div class="no-opportunities">현재 차익거래 기회가 없습니다</div>';
                return;
            }

            let html = '';
            opportunities.slice(0, 10).forEach(opp => {
                const longURL = getExchangeURL(opp.longExchange, opp.symbol);
                const shortURL = getExchangeURL(opp.shortExchange, opp.symbol);

                html += `
                    <div class="opportunity-card">
                        <div class="opportunity-header">
                            <div class="opportunity-symbol">${opp.symbol.toUpperCase()}</div>
                            <div class="opportunity-spread">${opp.spreadPercentage.toFixed(4)}%</div>
                        </div>
                        <div class="opportunity-strategy">
                            <a href="${longURL}" target="_blank" style="text-decoration: none;">
                                <div class="exchange-badge long">
                                    LONG ${opp.longExchange.toUpperCase()}<br>
                                    ${(opp.longRate * 100).toFixed(4)}%
                                </div>
                            </a>
                            <div class="arrow">→</div>
                            <a href="${shortURL}" target="_blank" style="text-decoration: none;">
                                <div class="exchange-badge short">
                                    SHORT ${opp.shortExchange.toUpperCase()}<br>
                                    ${(opp.shortRate * 100).toFixed(4)}%
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateDashboard(data) {
            const { fundingRates, opportunities, timestamp } = data;

            // Update stats
            updateStats(opportunities, fundingRates);

            // Update opportunities
            updateOpportunities(opportunities);

            // Update verification symbols
            updateVerificationSymbols();

            // Group rates by symbol with full rate objects
            const ratesBySymbol = {};
            fundingRates.forEach(rate => {
                if (!ratesBySymbol[rate.symbol]) {
                    ratesBySymbol[rate.symbol] = {};
                }
                ratesBySymbol[rate.symbol][rate.exchange] = rate;
            });

            // Get all exchanges
            const exchanges = [...new Set(fundingRates.map(r => r.exchange))];

            // Apply filters
            const exchangeFilter = document.getElementById('exchangeFilter').value;
            const symbolSearch = document.getElementById('symbolSearch').value.toLowerCase();

            // Build table
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2">토큰</th>
                            ${exchanges.map(ex => `<th colspan="3">${ex.toUpperCase()}</th>`).join('')}
                            <th rowspan="2">스프레드</th>
                        </tr>
                        <tr>
                            ${exchanges.map(() => `<th style="font-size: 11px;">현재</th><th style="font-size: 11px;">7일</th><th style="font-size: 11px;">30일</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            Object.keys(ratesBySymbol).sort().forEach(symbol => {
                // Apply symbol filter
                if (symbolSearch && !symbol.toLowerCase().includes(symbolSearch)) {
                    return;
                }

                const rates = ratesBySymbol[symbol];

                // Apply exchange filter
                if (exchangeFilter !== 'all' && !rates[exchangeFilter]) {
                    return;
                }

                const rateObjects = Object.values(rates).filter(v => v !== undefined);
                const rateValues = rateObjects.map(r => r.fundingRate);
                const maxRate = Math.max(...rateValues);
                const minRate = Math.min(...rateValues);
                const spread = maxRate - minRate;

                html += `<tr>`;
                html += `<td class="symbol">${symbol.toUpperCase()}</td>`;

                exchanges.forEach(exchange => {
                    const rateObj = rates[exchange];
                    if (rateObj !== undefined) {
                        const ratePercent = (rateObj.fundingRate * 100).toFixed(4);
                        const rateClass = rateObj.fundingRate > 0 ? 'positive' : rateObj.fundingRate < 0 ? 'negative' : 'neutral';
                        const exchangeURL = getExchangeURL(exchange, symbol);

                        // Current rate
                        html += `<td><a href="${exchangeURL}" target="_blank" class="symbol-link"><span class="rate ${rateClass}">${ratePercent}%</span></a></td>`;

                        // 7-day cumulative
                        if (rateObj.cumulativeFunding7d !== undefined) {
                            const cum7d = (rateObj.cumulativeFunding7d * 100).toFixed(3);
                            const cum7dClass = rateObj.cumulativeFunding7d > 0 ? 'positive' : rateObj.cumulativeFunding7d < 0 ? 'negative' : 'neutral';
                            html += `<td><span class="rate ${cum7dClass}" style="font-size: 12px;">${cum7d}%</span></td>`;
                        } else {
                            html += `<td class="no-data" style="font-size: 11px;">-</td>`;
                        }

                        // 30-day cumulative
                        if (rateObj.cumulativeFunding30d !== undefined) {
                            const cum30d = (rateObj.cumulativeFunding30d * 100).toFixed(3);
                            const cum30dClass = rateObj.cumulativeFunding30d > 0 ? 'positive' : rateObj.cumulativeFunding30d < 0 ? 'negative' : 'neutral';
                            html += `<td><span class="rate ${cum30dClass}" style="font-size: 12px;">${cum30d}%</span></td>`;
                        } else {
                            html += `<td class="no-data" style="font-size: 11px;">-</td>`;
                        }
                    } else {
                        html += `<td class="no-data" colspan="3">-</td>`;
                    }
                });

                const spreadPercent = (spread * 100).toFixed(4);
                const spreadClass = spread > 0.0001 ? 'high' : '';
                html += `<td><span class="spread ${spreadClass}">${spreadPercent}%</span></td>`;
                html += `</tr>`;
            });

            html += `</tbody></table>`;

            document.getElementById('content').innerHTML = html;

            // Update timestamp
            const date = new Date(timestamp);
            document.getElementById('lastUpdate').textContent =
                `마지막 업데이트: ${date.toLocaleString('ko-KR')}`;
        }

        // Populate verification symbol dropdown
        function updateVerificationSymbols() {
            if (!currentData) return;

            const symbolSet = new Set();
            currentData.fundingRates.forEach(rate => {
                symbolSet.add(rate.symbol);
            });

            const select = document.getElementById('verifySymbol');
            const currentValue = select.value;
            select.innerHTML = '<option value="">선택</option>';

            Array.from(symbolSet).sort().forEach(symbol => {
                const option = document.createElement('option');
                option.value = symbol;
                option.textContent = symbol.toUpperCase();
                select.appendChild(option);
            });

            if (currentValue && symbolSet.has(currentValue)) {
                select.value = currentValue;
            }
        }

        // Show verification data
        function showVerificationData() {
            const exchange = document.getElementById('verifyExchange').value;
            const symbol = document.getElementById('verifySymbol').value;
            const period = document.getElementById('verifyPeriod').value;

            if (!exchange || !symbol || !currentData) {
                alert('거래소와 토큰을 선택해주세요.');
                return;
            }

            // Find the rate object
            const rateObj = currentData.fundingRates.find(r =>
                r.exchange === exchange && r.symbol === symbol
            );

            if (!rateObj) {
                alert('선택한 거래소/토큰의 데이터를 찾을 수 없습니다.');
                return;
            }

            const history = period === '7' ? rateObj.history7d : rateObj.history30d;

            if (!history || history.length === 0) {
                alert(`${period}일 히스토리 데이터가 없습니다.`);
                return;
            }

            // Build verification table
            let html = `
                <h3 style="color: #00d4aa; margin-bottom: 15px;">
                    ${exchange.toUpperCase()} - ${symbol.toUpperCase()} (${period}일)
                </h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>시간</th>
                            <th>펀딩 레이트</th>
                            <th>누적 합계</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let cumulative = 0;
            history.forEach((entry, index) => {
                cumulative += entry.fundingRate;
                const date = new Date(entry.timestamp);
                const ratePercent = (entry.fundingRate * 100).toFixed(4);
                const cumulativePercent = (cumulative * 100).toFixed(4);
                const rateClass = entry.fundingRate > 0 ? 'positive' : entry.fundingRate < 0 ? 'negative' : 'neutral';
                const cumulativeClass = cumulative > 0 ? 'positive' : cumulative < 0 ? 'negative' : 'neutral';

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="font-size: 12px;">${date.toLocaleString('ko-KR')}</td>
                        <td><span class="rate ${rateClass}">${ratePercent}%</span></td>
                        <td><span class="rate ${cumulativeClass}" style="font-weight: 700;">${cumulativePercent}%</span></td>
                    </tr>
                `;
            });

            const finalCumulative = period === '7' ? rateObj.cumulativeFunding7d : rateObj.cumulativeFunding30d;
            const finalPercent = finalCumulative !== undefined ? (finalCumulative * 100).toFixed(4) : 'N/A';

            html += `
                    </tbody>
                    <tfoot style="background: #1e2a47; font-weight: 700;">
                        <tr>
                            <td colspan="2">최종 합계 (${history.length}개 항목)</td>
                            <td>-</td>
                            <td><span style="color: #00d4aa; font-size: 16px;">${finalPercent}%</span></td>
                        </tr>
                    </tfoot>
                </table>
            `;

            document.getElementById('verificationContent').innerHTML = html;
            document.getElementById('verificationTable').style.display = 'block';
        }

        // Setup filters
        document.addEventListener('DOMContentLoaded', () => {
            initChart();

            document.getElementById('exchangeFilter').addEventListener('change', () => {
                if (currentData) updateDashboard(currentData);
            });

            document.getElementById('symbolSearch').addEventListener('input', () => {
                if (currentData) updateDashboard(currentData);
            });

            document.getElementById('verifyButton').addEventListener('click', showVerificationData);
        });

        // Connect on load
        connect();
    </script>
</body>
</html>
